<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#d7ff00" media="(prefers-color-scheme: light)">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-title" content="FileFlash">
  <title>FileFlash · 闪传</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/sha256.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-flash" viewBox="0 0 24 24"><path d="M7 7h10v10" />
  <path d="M7 17 17 7" />
</symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
  <polyline points="17 8 12 3 7 8" />
  <line x1="12" x2="12" y1="3" y2="15" />
</symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
  <polyline points="7 10 12 15 17 10" />
  <line x1="12" x2="12" y1="15" y2="3" />
</symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M20 7h-3a2 2 0 0 1-2-2V2" />
  <path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z" />
  <path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8" />
</symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7" />
  <line x1="9" x2="15" y1="20" y2="20" />
  <line x1="12" x2="12" y1="4" y2="20" />
</symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
  <path d="M3 3v5h5" />
  <path d="M12 7v5l4 2" />
</symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
</symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
</symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
  <path d="m21.854 2.147-10.94 10.939" />
</symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2" />
  <path d="M15 7h2a5 5 0 1 1 0 10h-2" />
  <line x1="8" x2="16" y1="12" y2="12" />
</symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 7h10v10" />
  <path d="M7 17 17 7" />
</symbol>
  </defs></svg>
  <header class="header">
    <div class="masthead">
      <a class="brand" href="/" aria-label="FileFlash 首页"><span class="brand-first">FILE</span><span class="brand-last">FLASH</span></a>
      <span class="brand-direction" aria-hidden="true"><svg><use href="#i-arrow-up-right"/></svg></span>
      <button id="connection-button" class="connection" type="button" aria-expanded="false" aria-controls="connection-details"><span id="connection-dot" class="dot"></span><span id="connection-label">未连接</span><svg aria-hidden="true"><use href="#i-link"/></svg></button>
    </div>
  </header>
  <main class="shell">
    <section id="connection-details" class="connection-details" hidden>
      <div class="details-top"><strong id="server-name">连接详情</strong><button id="refresh-button" class="button quiet small" type="button"><svg aria-hidden="true"><use href="#i-refresh"/></svg>重新连接</button></div>
      <p id="server-address" class="mono"></p>
      <p class="help">局域网 HTTP 未加密，请仅在可信网络使用。</p>
      <button id="diagnostic-button" class="button quiet small" type="button" hidden>诊断</button>
      <button id="picker-test-button" class="button quiet small" type="button" aria-expanded="false" aria-controls="picker-test-panel" hidden>选取测试</button>
      <button id="disconnect-button" class="button quiet danger" type="button" hidden>断开连接</button>
      <div id="picker-test-panel" hidden><input id="native-file-input" class="native-picker" type="file" aria-label="原生选取测试（单选）"></div>
    </section>
    <div id="connection-error" class="notice warning" role="status" hidden></div>
    <section id="pair-panel" class="pair-panel" aria-labelledby="pair-title">
      <div class="pair-heading"><span class="section-index" aria-hidden="true">01</span><h1 id="pair-title">连接设备</h1></div>
      <form id="pair-form">
        <label for="pair-token">配对码</label>
        <input id="pair-token" name="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <label for="device-name">本机名称</label>
        <input id="device-name" name="name" type="text" autocomplete="off" maxlength="80" required>
        <p id="pair-error" class="field-error" role="alert" hidden></p>
        <button id="pair-button" class="button primary full" type="submit">连接</button>
      </form>
    </section>
    <div id="workspace" hidden>
      <nav class="tabs" aria-label="传输内容">
        <button class="tab active" data-tab="files" type="button" aria-current="page"><span class="tab-number" aria-hidden="true">01</span><span class="tab-label">文件</span><svg aria-hidden="true"><use href="#i-file"/></svg></button>
        <button class="tab" data-tab="texts" type="button"><span class="tab-number" aria-hidden="true">02</span><span class="tab-label">文字</span><span id="text-badge" class="badge" hidden></span><svg aria-hidden="true"><use href="#i-text"/></svg></button>
        <button class="tab" data-tab="tasks" type="button"><span class="tab-number" aria-hidden="true">03</span><span class="tab-label">任务</span><span id="task-badge" class="badge" hidden></span><svg aria-hidden="true"><use href="#i-activity"/></svg></button>
      </nav>
      <section id="panel-files" class="panel" aria-label="文件">
        <div class="send-bar"><span id="queue-summary" class="help" role="status" hidden></span><div class="send-actions"><button id="choose-media" class="button primary" type="button" aria-haspopup="dialog" hidden><svg aria-hidden="true"><use href="#i-arrow-up-right"/></svg>照片 / 视频</button><button id="choose-files" class="button primary" type="button"><svg aria-hidden="true"><use href="#i-upload"/></svg><span id="choose-files-label">选择文件</span></button></div></div>
        <div class="section-heading"><span class="section-index" aria-hidden="true">01</span><h1>接收文件</h1><span id="file-count" class="count"></span></div>
        <div id="file-list" class="list"></div>
        <p id="download-note" class="help download-note" hidden>下载进度见浏览器。</p>
      </section>
      <section id="panel-texts" class="panel" aria-label="文字" hidden>
        <form id="text-form" class="composer">
          <label for="text-input">发送文字</label>
          <textarea id="text-input" rows="6" placeholder="输入或粘贴文字" spellcheck="false"></textarea>
          <div class="composer-footer"><span id="text-count" class="help">0 字符</span><button id="send-text" class="button primary" type="submit"><svg aria-hidden="true"><use href="#i-send"/></svg>发送</button></div>
          <p id="text-error" class="field-error" role="alert" hidden></p>
        </form>
        <div class="section-heading"><span class="section-index" aria-hidden="true">02</span><h1>文字记录</h1><span id="text-total" class="count"></span></div>
        <div id="text-list" class="text-list"></div>
      </section>
      <section id="panel-tasks" class="panel" aria-label="任务" hidden>
        <div class="section-heading task-heading"><span class="section-index" aria-hidden="true">03</span><h1>传输任务</h1><button id="clear-tasks" class="button quiet small" type="button">清除已结束</button></div>
        <p id="foreground-note" class="notice" hidden>传输时保持前台；中断后重新发送。</p>
        <div id="task-list" class="list"></div>
      </section>
    </div>
    <input id="file-input" type="file" multiple hidden>
  </main>
  <dialog id="media-dialog" aria-labelledby="media-title">
    <div class="details-top"><h2 id="media-title">照片 / 视频</h2><form method="dialog"><button class="button quiet" type="submit">关闭</button></form></div>
    <a id="shortcut-download" class="button primary" href="/FileFlash.shortcut" download="FileFlash.shortcut">添加快捷指令</a>
    <ol class="media-steps"><li>照片 → 分享 → 选项 → 当前</li><li>FileFlash → 扫安卓二维码</li></ol>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="notice">请在 Safari 设置中启用 JavaScript，再重新打开此页面。</p></noscript>
</body>
</html>
